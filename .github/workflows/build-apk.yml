name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR_VERSION=$(echo "$JAVA_VER_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F. '{print ($1=="1"?$2:$1)}')

          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR_VERSION"

          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java version ($JAVA_MAJOR_VERSION) is lower than required version 17."
            exit 1
          fi

          echo "Java environment verified successfully (Java $JAVA_MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists at $KEYSTORE_PATH."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ $? -ne 0 ] || [ ! -f "$KEYSTORE_PATH" ]; then
              echo "::error::Failed to generate temporary debug keystore."
              exit 1
            fi
            echo "Temporary debug keystore successfully created."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK."
            echo "Searching discovered APKs inside app/build/outputs/apk/ only:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension."; exit 1 ;;
          esac

          echo "APK verification passed: $EXPECTED_APK exists and is a non-empty regular file."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TEMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$RUNNER_TEMP_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          BASE_NAME=$(echo "$RAW_REPO_NAME" | awk -F '/' '{print $NF}' | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g' -e 's/^-*//;s/-*$//')
          if [ -z "$BASE_NAME" ]; then
            BASE_NAME="android-app"
          fi

          RELEASE_FILENAME="${BASE_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_ASSET_PATH="${RUNNER_TEMP_DIR}/${RELEASE_FILENAME}"

          cp -v "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_ASSET_PATH"

          if [ ! -f "$TARGET_ASSET_PATH" ] || [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "::error::Prepared release asset $TARGET_ASSET_PATH is invalid or empty."
            exit 1
          fi

          echo "asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "release_title=Debug APK Build #${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          TAG="${{ steps.prepare_asset.outputs.tag_name }}"
          TITLE="${{ steps.prepare_asset.outputs.release_title }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "::error::Release asset $ASSET_PATH is not a .apk file."; exit 1 ;;
          esac

          RELEASE_NOTES=$(cat << 'EOF'
          ### 📱 Automated Debug Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** ${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Tag:** debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}

          > ⚠️ **Note:** This APK is intended for testing purposes only. It is not a Google Play Store production release and is signed using a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag $TAG..."
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.prepare_asset.outputs.tag_name }}"
          TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          echo "=========================================="
          echo "             BUILD & RELEASE SUMMARY      "
          echo "=========================================="

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully!"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG")
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo ""
            echo "The debug APK is available for direct download under the release Assets section on GitHub Releases."
            echo "Backup Actions artifact 'app-debug-apk' is also preserved."

            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct APK Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📥 **Download:** Download the \`.apk\` directly onto your Android device from the **Assets** section of the [GitHub Release]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Backup:** The standard GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or failed. However, the APK build and artifact upload succeeded!"
            echo "The debug APK artifact named 'app-debug-apk' is available for download from this workflow run's Summary page."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact Name:** \`app-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download Location:** Download \`app-debug-apk\` from the **Artifacts** section at the bottom of this workflow run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
